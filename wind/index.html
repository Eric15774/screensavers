const HOME = {lon:-79.52, lat:40.79, name:'Lenape Tech'};
const CITIES = [['Pittsburgh',-80.00,40.44],['Philadelphia',-75.16,39.95],['Harrisburg',-76.88,40.27],['Erie',-80.08,42.13],['Scranton',-75.66,41.41],['State College',-77.86,40.79]];

// Fixed grid of sample points that covers the map with room to spare
const G = {lon0:-82, lat0:38.6, dlon:0.55, dlat:0.5333, nx:17, ny:10};
const REFRESH_MS = 3*3600e3, RETRY_MS = 5*60e3, CACHE = 'windPA_v1';

const mapC = document.getElementById('map'), mctx = mapC.getContext('2d');
const flowC = document.getElementById('flow'), fctx = flowC.getContext('2d');
let W, H, DPR, S, CX, CY;
const KX = Math.cos(41*Math.PI/180);
const px = lon => CX + (lon + 77.6)*S*KX;
const py = lat => CY - (lat - 41.0)*S;
const lonOf = x => (x - CX)/(S*KX) - 77.6;
const latOf = y => 41.0 - (y - CY)/S;

function resize(){
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  for (const c of [mapC, flowC]){ c.width = W*DPR; c.height = H*DPR; }
  mctx.setTransform(DPR,0,0,DPR,0,0); fctx.setTransform(DPR,0,0,DPR,0,0);
  S = Math.min(W*0.84/(5.83*KX), H*0.78/2.55);   // pixels per degree of latitude, fits PA
  CX = W/2; CY = H/2;
  drawMap(); seed();
}

function line(ctx, pts){ ctx.moveTo(px(pts[0][0]), py(pts[0][1])); for (let i = 1; i < pts.length; i++) ctx.lineTo(px(pts[i][0]), py(pts[i][1])); }
function drawMap(){
  const c = mctx; c.clearRect(0,0,W,H);
  const g = c.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  g.addColorStop(0,'#0a1426'); g.addColorStop(1,'#03060d'); c.fillStyle = g; c.fillRect(0,0,W,H);
  c.lineJoin = 'round'; c.lineCap = 'round';
  // Pennsylvania, softly filled
  c.beginPath(); for (const r of GEO.pa) { line(c, r); c.closePath(); }
  c.fillStyle = 'rgba(70,110,170,0.07)'; c.fill();
  // Neighboring borders and coast
  c.beginPath(); for (const l of GEO.borders) line(c, l); for (const l of GEO.coast) line(c, l);
  c.strokeStyle = 'rgba(150,180,230,0.16)'; c.lineWidth = 1; c.stroke();
  // Major rivers, very faint
  c.beginPath(); for (const r of GEO.rivers) if (r.big) line(c, r.p);
  c.strokeStyle = 'rgba(90,150,220,0.13)'; c.lineWidth = 1.2; c.stroke();
  // PA outline on top
  c.beginPath(); for (const r of GEO.pa) { line(c, r); c.closePath(); }
  c.strokeStyle = 'rgba(170,200,245,0.35)'; c.lineWidth = 1.4; c.stroke();
  // Cities and home
  const fs = Math.max(10, Math.round(H/90));
  c.font = fs + 'px "Segoe UI",system-ui,sans-serif'; c.textBaseline = 'middle';
  for (const [n, lo, la] of CITIES){
    c.fillStyle = 'rgba(200,215,240,0.35)'; c.beginPath(); c.arc(px(lo), py(la), 2, 0, 7); c.fill();
    c.fillStyle = 'rgba(200,215,240,0.28)'; c.fillText(n, px(lo) + 6, py(la));
  }
  c.fillStyle = 'rgba(255,200,87,0.85)'; c.beginPath(); c.arc(px(HOME.lon), py(HOME.lat), 3.2, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,200,87,0.55)'; c.fillText(HOME.name, px(HOME.lon) + 7, py(HOME.lat));
}

// ---------- wind data ----------
let data = null;        // {times:[ms...], u:[[...per point] per hour], v:[...]}
let U = null, V = null; // current field (mph), blended between hours
function gridPoints(){
  const la = [], lo = [];
  for (let i = 0; i < G.ny; i++) for (let j = 0; j < G.nx; j++){ la.push((G.lat0 + i*G.dlat).toFixed(3)); lo.push((G.lon0 + j*G.dlon).toFixed(3)); }
  return [la, lo];
}
function parse(arr){
  const times = arr[0].hourly.time.map(t => Date.parse(t + 'Z'));
  const u = times.map(() => new Float32Array(arr.length)), v = times.map(() => new Float32Array(arr.length));
  arr.forEach((p, k) => p.hourly.time.forEach((_, h) => {
    const s = p.hourly.wind_speed_10m[h] ?? 0, d = (p.hourly.wind_direction_10m[h] ?? 0)*Math.PI/180;
    u[h][k] = -s*Math.sin(d); v[h][k] = -s*Math.cos(d);   // direction is where the wind comes FROM
  }));
  return {times, u, v};
}

    const arr = await r.json();
    data = parse(arr); fetchedAt = Date.now(); blend();
    try { localStorage.setItem(CACHE, JSON.stringify({t: fetchedAt, arr})); } catch(e){}
    setTimeout(load, REFRESH_MS);
  } catch(e){
    if (!data) document.getElementById('info').textContent = 'Waiting for wind data…';
    setTimeout(load, RETRY_MS);
  }
}
let fetchedAt = 0;
function blend(){
  if (!data) return;
  const t = Date.now(), T = data.times;
  let h = 0; while (h < T.length - 2 && T[h+1] <= t) h++;
  const f = Math.max(0, Math.min(1, (t - T[h])/(T[h+1] - T[h])));
  const n = G.nx*G.ny; U = new Float32Array(n); V = new Float32Array(n);
  for (let k = 0; k < n; k++){ U[k] = data.u[h][k]*(1-f) + data.u[h+1][k]*f; V[k] = data.v[h][k]*(1-f) + data.v[h+1][k]*f; }
  caption();
}
const DIRS = ['north','northeast','east','southeast','south','southwest','west','northwest'];
function caption(){
  // average over grid points inside the PA bounding box
  let su = 0, sv = 0, ss = 0, n = 0;
  for (let i = 0; i < G.ny; i++) for (let j = 0; j < G.nx; j++){
    const lo = G.lon0 + j*G.dlon, la = G.lat0 + i*G.dlat;
    if (lo < -80.5 || lo > -74.7 || la < 39.7 || la > 42.3) continue;
    const k = i*G.nx + j; su += U[k]; sv += V[k]; ss += Math.hypot(U[k], V[k]); n++;
  }
  const from = (Math.atan2(-su, -sv)*180/Math.PI + 360) % 360;
  const avg = Math.round(ss/n), steady = Math.hypot(su, sv)/ss > 0.5;
  const tm = new Date(fetchedAt).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  document.getElementById('info').textContent = 'Live · about ' + avg + ' mph' +
    (steady ? ' from the ' + DIRS[Math.round(from/45) % 8] : ', shifting directions') + ' · Open-Meteo data from ' + tm;
}
function windAt(lon, lat, out){
  const gx = (lon - G.lon0)/G.dlon, gy = (lat - G.lat0)/G.dlat;
  if (gx < 0 || gy < 0 || gx >= G.nx - 1 || gy >= G.ny - 1){ out[0] = out[1] = 0; return; }
  const j = gx|0, i = gy|0, fx = gx - j, fy = gy - i, k = i*G.nx + j;
  const a = (1-fx)*(1-fy), b = fx*(1-fy), c = (1-fx)*fy, d = fx*fy;
  out[0] = U[k]*a + U[k+1]*b + U[k+G.nx]*c + U[k+G.nx+1]*d;
  out[1] = V[k]*a + V[k+1]*b + V[k+G.nx]*c + V[k+G.nx+1]*d;
}

// ---------- particles ----------
// Each particle remembers its last few positions, and the trail is redrawn
// every frame with the oldest part faintest. Colors go from calm to gusty (mph).
const BANDS = [[3,[70,130,200]],[7,[110,175,230]],[12,[170,215,240]],[18,[235,245,250]],[25,[255,215,120]],[1e9,[255,145,110]]];
const TIERS = [0.2, 0.48, 0.95], TRAIL = 16;   // trail length in samples
let P = [];
function seed(){
  const n = Math.min(5000, Math.round(W*H/380));
  P = new Array(n); for (let i = 0; i < n; i++) spawn(P[i] = {hx: new Float32Array(TRAIL), hy: new Float32Array(TRAIL)}, true);
}
function spawn(p, initial){
  p.x = Math.random()*W; p.y = Math.random()*H; p.age = initial ? Math.random()*4 : 0; p.life = 3 + Math.random()*6;
  p.hx.fill(p.x); p.hy.fill(p.y); p.h = 0; p.n = 1; p.band = 0;
}
const tmp = [0,0];
const buckets = BANDS.map(() => TIERS.map(() => []));
let last = 0, lastBlend = 0, tick = 0;
function frame(t){
  const dt = Math.min(0.05, (t - (last || t))/1000); last = t;
  if (t - lastBlend > 30000){ blend(); lastBlend = t; }
  fctx.clearRect(0,0,W,H);
  if (U){
    const k = S*0.013;       // pixels per second per mph
    const sample = (++tick % 3) === 0;
    for (const b of buckets) for (const a of b) a.length = 0;
    for (const p of P){
      windAt(lonOf(p.x), latOf(p.y), tmp);
      const sp = Math.hypot(tmp[0], tmp[1]);
      p.x += tmp[0]*k*dt; p.y -= tmp[1]*k*dt; p.age += dt;
      let bi = 0; while (sp > BANDS[bi][0]) bi++; p.band = bi;
      if (sample){ p.h = (p.h + 1) % TRAIL; p.n = Math.min(TRAIL, p.n + 1); }
      p.hx[p.h] = p.x; p.hy[p.h] = p.y;
      // fade in at birth and out at death
      const life = Math.min(1, p.age/0.8, (p.life - p.age)/0.8);
      const fadeTier = life < 0.34 ? 0 : life < 0.67 ? 1 : 2;
      // split the trail into three runs, newest brightest; each run is one continuous line
      const third = (p.n - 1)/3;
      for (let tier = 2; tier >= 0; tier--){
        const s0 = Math.round((2 - tier)*third), s1 = Math.round((3 - tier)*third);
        if (s1 <= s0) continue;
        const run = buckets[bi][Math.min(fadeTier, tier)];
        run.push(-1);   // marks the start of a run
        for (let s = s0; s <= s1; s++){ const a = (p.h - s + TRAIL) % TRAIL; run.push(p.hx[a], p.hy[a]); }
      }
      if (p.age > p.life || p.x < -20 || p.y < -20 || p.x > W + 20 || p.y > H + 20) spawn(p);
    }
    fctx.lineWidth = Math.max(1.1, H/800); fctx.lineCap = 'butt'; fctx.lineJoin = 'miter';
    buckets.forEach((b, bi) => b.forEach((a, ti) => {
      if (!a.length) return;
      fctx.beginPath();
      for (let i = 0; i < a.length;){
        if (a[i] === -1){ fctx.moveTo(a[i+1], a[i+2]); i += 3; } else { fctx.lineTo(a[i], a[i+1]); i += 2; }
      }
      const c = BANDS[bi][1]; fctx.strokeStyle = 'rgba(' + c + ',' + TIERS[ti] + ')'; fctx.stroke();
    }));
  }
  requestAnimationFrame(frame);
}

document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F'){ if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
});
let idleT; function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); }
addEventListener('mousemove', wake); wake();
addEventListener('resize', resize);
resize(); load(); requestAnimationFrame(frame);
setTimeout(() => document.getElementById('fade').classList.add('clear'), 300);
setTimeout(() => location.reload(), 12*3600e3);
</script>
</body>
