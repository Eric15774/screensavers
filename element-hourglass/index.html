<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Element Hourglass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; font-family: Inter, Arial, sans-serif; color: #e9edf5; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.idle { cursor: none; }
  #card {
    position: fixed; width: min(440px, 90vw); box-sizing: border-box; padding: 22px 24px 20px;
    background: rgba(13, 19, 38, 0.95); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    opacity: 0; transition: opacity .6s; pointer-events: none;
  }
  #card.show { opacity: 1; }
  #card.right { right: 5vw; top: 50%; transform: translateY(-50%); }
  #card.bottom { left: 0; right: 0; margin: 0 auto; bottom: 2vh; width: min(460px, 94vw); padding: 16px 18px 14px; }
  .count { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #ffc857; font-weight: 600; margin-bottom: 12px; }
  .head { display: flex; align-items: center; gap: 16px; }
  .tile { width: 74px; height: 74px; border-radius: 10px; color: #141822; position: relative; flex: none; }
  .tile .z { position: absolute; left: 7px; top: 5px; font-size: 13px; font-weight: 600; }
  .tile .s { position: absolute; left: 0; right: 0; top: 19px; text-align: center; font-size: 34px; font-weight: 800; }
  .head h1 { margin: 0; font-size: 30px; font-weight: 800; }
  .chip { display: inline-block; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 99px; color: #141822; margin-top: 6px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-top: 16px; }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8b96ad; margin-bottom: 3px; }
  .val { font-size: 17px; font-weight: 600; }
  .row { margin-top: 13px; }
  .txt { font-size: 15px; color: #d3d9e4; line-height: 1.4; }
  .note { margin-top: 14px; padding: 9px 12px; border-radius: 10px; background: rgba(255,200,87,.1); border: 1px solid rgba(255,200,87,.35); font-size: 14px; color: #ffe2a6; line-height: 1.4; }
  .bar { margin-top: 16px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar div { height: 100%; background: #ffc857; border-radius: 3px; }
  #card.bottom .head h1 { font-size: 24px; }
  #card.bottom .tile { width: 60px; height: 60px; }
  #card.bottom .tile .s { top: 16px; font-size: 27px; }
  #card.bottom .val { font-size: 15px; }
  #card.bottom .txt, #card.bottom .note { font-size: 13px; }
  #card.bottom .facts { gap: 8px 14px; margin-top: 10px; }
  #card.bottom .row { margin-top: 9px; }
  #title { position: fixed; left: 24px; top: 18px; pointer-events: none; }
  #title h2 { margin: 0; font-size: 22px; font-weight: 800; }
  #title div { font-size: 13px; color: #8b96ad; margin-top: 3px; }
  #fs { position: fixed; right: 16px; top: 14px; background: rgba(255,255,255,.1); color: #e9edf5; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 7px 12px; font: 600 13px Inter, Arial, sans-serif; cursor: pointer; transition: opacity .6s; }
  body.idle #fs { opacity: 0; pointer-events: none; }
  #hint { position: fixed; left: 24px; bottom: 16px; font-size: 12px; color: #6f7a92; transition: opacity .6s; }
  body.idle #hint { opacity: 0; }
</style>
</head>

  alkali:     { color: "#ef8a8a", label: "Alkali metal", z: [3, 11, 19, 37, 55, 87] },
  alkaline:   { color: "#f5ad73", label: "Alkaline earth metal", z: [4, 12, 20, 38, 56, 88] },
  transition: { color: "#f2d473", label: "Transition metal", z: [] },
  post:       { color: "#a9d68d", label: "Post-transition metal", z: [13, 31, 49, 50, 81, 82, 83, 84, 113, 114, 115, 116] },
  metalloid:  { color: "#74d3bd", label: "Metalloid", z: [5, 14, 32, 33, 51, 52] },
  nonmetal:   { color: "#86b6f2", label: "Nonmetal", z: [1, 6, 7, 8, 15, 16, 34] },
  halogen:    { color: "#a5dcf2", label: "Halogen", z: [9, 17, 35, 53, 85, 117] },
  noble:      { color: "#bba3f2", label: "Noble gas", z: [2, 10, 18, 36, 54, 86, 118] },
  lanthanide: { color: "#f2a9d2", label: "Lanthanide", z: [] },
  actinide:   { color: "#d4b08c", label: "Actinide", z: [] }
};
function category(z) {
  if (z >= 57 && z <= 71) return "lanthanide";
  if (z >= 89 && z <= 103) return "actinide";
  for (const k in CATS) if (CATS[k].z.includes(z)) return k;
  return "transition";
}
DATA.forEach(d => { d.cat = category(d.z); });
const N = DATA.length;

// Short notes that appear at milestones along the way
const NOTES = {
  1: "Period 1 begins with the simplest atom there is: one proton and one electron.",
  2: "Period 1 is complete. The first electron shell holds only two electrons.",
  3: "Period 2 begins. Electrons start filling a second shell.",
  10: "Period 2 is complete. A noble gas closes every row of the table.",
  11: "Period 3 begins. Notice how sodium acts a lot like lithium, right above it.",
  18: "Period 3 is complete. Argon makes up almost 1% of the air you breathe.",
  19: "Period 4 begins, and with it the first row of transition metals.",
  21: "The transition metals begin. They fill the d subshell.",
  26: "Iron is the end of the line for fusion in stars. Heavier elements come from supernovas and colliding neutron stars.",
  36: "Period 4 is complete.",
  37: "Period 5 begins.",
  43: "Technetium is the lightest element with no stable isotopes.",
  54: "Period 5 is complete.",
  55: "Period 6 begins. It is 32 elements long because of the lanthanides.",
  57: "The lanthanides begin. These 15 elements fill the 4f subshell and are hard to tell apart chemically.",
  79: "Gold. Nearly all of Earth's gold sank to the core when the planet was young. What we mine arrived later.",
  82: "Lead is the heaviest element with stable isotopes. Everything after it is radioactive.",
  86: "Period 6 is complete. Radon is a radioactive gas that seeps up from the ground in parts of Pennsylvania.",
  87: "Period 7 begins.",
  89: "The actinides begin. They fill the 5f subshell, and all of them are radioactive.",
  92: "Uranium is the heaviest element found in large amounts in nature.",
  93: "Neptunium is the first transuranium element, heavier than uranium. From here on, nearly everything is made in reactors or particle accelerators.",
  104: "The superheavy elements begin. Most of these have been made only a few atoms at a time.",
  118: "Oganesson completes Period 7 and the whole table. Only about five atoms of it have ever been detected."
};

// ---------- canvas and layout ----------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W, H, DPR, L; // L = layout
const landscape = () => innerWidth / innerHeight > 1.15;

function halfW(d) { // half-width of a bulb at normalized distance d from the neck (0 = neck, 1 = cap)
  if (d <= 0) return L.nw;
  if (d <= 0.72) return L.nw + (L.mw - L.nw) * Math.pow(Math.sin(d / 0.72 * Math.PI / 2), 0.85);
  const u = Math.min(1, (d - 0.72) / 0.28);
  return L.mw * (1 - 0.22 * u * u);
}

function buildSlots(fromNeck) {
  // Returns rows of slots for one bulb. h = height of slot center measured from the bulb floor
  // (top bulb: the floor is the neck, bottom bulb: the floor is the cap).
  const { s, bh } = L, pitch = s * 1.06, rh = s * 1.02, slots = [];
  for (let r = 0; ; r++) {
    const h0 = r * rh + (fromNeck ? s * 0.15 : s * 0.06), h1 = h0 + s;
    if (h1 > bh * 0.97) break;
    const dA = fromNeck ? h0 / bh : (bh - h0) / bh, dB = fromNeck ? h1 / bh : (bh - h1) / bh;
    const avail = Math.min(halfW(dA), halfW(dB)) - s * 0.56;
    if (avail < 0) continue;
    const off = (r % 2 && avail >= pitch * 0.5) ? 0.5 : 0;
    for (let j = -40; j <= 40; j++) {
      const x = (j + off) * pitch;
      if (Math.abs(x) <= avail) slots.push({ r, x, h: (h0 + h1) / 2, c: Math.abs(x) / pitch });
    }
  }
  return slots;
}

function layout() {
  DPR = window.devicePixelRatio || 1;
  W = canvas.width = Math.round(innerWidth * DPR);
  H = canvas.height = Math.round(innerHeight * DPR);
  const land = landscape();
  const HG = land ? H * 0.84 : Math.min(H * 0.56, W * 1.25);
  L = { cx: land ? W * 0.37 : W / 2, cy: land ? H * 0.53 : H * 0.36, HG };
  L.ct = HG * 0.035;
  L.bh = HG / 2 - L.ct;
  L.mw = L.bh * 0.58;
  let s = L.bh * 0.13;
  for (let k = 0; k < 80; k++, s *= 0.97) {
    L.s = s; L.nw = s * 0.66;
    const top = buildSlots(true).sort((a, b) => a.r - b.r || a.c - b.c);
    const bot = buildSlots(false).map(o => ({ ...o, p: o.r + o.c * 0.8 })).sort((a, b) => a.p - b.p || a.c - b.c);
    if (top.length < N || bot.length < N) continue;
    const topSel = top.slice(0, N), botSel = bot.slice(0, N);
    if (topSel[N - 1].h > L.bh * 0.86 || botSel[N - 1].h > L.bh * 0.9) continue;
    // Drain order for the top bulb: the surface caves in from the middle first, like a crater
    topSel.sort((a, b) => (b.r - b.c * 0.8) - (a.r - a.c * 0.8) || a.c - b.c);
    L.top = topSel; L.bot = botSel;
    break;
  }
  if (cardState) renderCard();
}
// screen position of a slot
const topPos = i => ({ x: L.cx + L.top[i].x, y: L.cy - L.top[i].h });
const botPos = i => ({ x: L.cx + L.bot[i].x, y: L.cy + L.bh - L.bot[i].h });

// ---------- drawing helpers ----------
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawTile(d, x, y, scale = 1, glow = 0, rot = 0) {
  const s = L.s * scale;
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (glow > 0) { ctx.shadowColor = "rgba(255,220,140," + glow + ")"; ctx.shadowBlur = s * 0.9; }
  ctx.fillStyle = CATS[d.cat].color;
  rrect(-s / 2, -s / 2, s, s, s * 0.14);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#141822";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const big = s >= 30 * DPR;
  ctx.font = `800 ${Math.round(s * (d.sym.length > 1 ? 0.42 : 0.5))}px Inter, Arial, sans-serif`;
  ctx.fillText(d.sym, 0, big ? s * 0.08 : s * 0.02);
  if (big) {
    ctx.font = `600 ${Math.round(s * 0.2)}px Inter, Arial, sans-serif`;
    ctx.textAlign = "left";
    ctx.fillText(d.z, -s * 0.42, -s * 0.3);
  }
  ctx.restore();
}

function glassPath() {
  const { cx, cy, bh } = L, steps = 60;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) { const d = 1 - i / steps; ctx.lineTo(cx - halfW(d), cy - d * bh); }
  for (let i = 0; i <= steps; i++) { const d = i / steps; ctx.lineTo(cx - halfW(d), cy + d * bh); }
  for (let i = 0; i <= steps; i++) { const d = 1 - i / steps; ctx.lineTo(cx + halfW(d), cy + d * bh); }
  for (let i = 0; i <= steps; i++) { const d = i / steps; ctx.lineTo(cx + halfW(d), cy - d * bh); }
  ctx.closePath();
}
function drawGlassBack() {
  glassPath();
  const g = ctx.createLinearGradient(L.cx - L.mw, 0, L.cx + L.mw, 0);
  g.addColorStop(0, "rgba(140,170,230,0.10)"); g.addColorStop(0.5, "rgba(140,170,230,0.03)"); g.addColorStop(1, "rgba(140,170,230,0.08)");
  ctx.fillStyle = g; ctx.fill();
}
function drawGlassFront() {
  glassPath();
  ctx.lineWidth = Math.max(1.5, L.s * 0.08);
  ctx.strokeStyle = "rgba(200,220,255,0.55)";
  ctx.stroke();
  // highlights
  const { cx, cy, bh } = L;
  ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.lineWidth = Math.max(2, L.s * 0.16);
  for (const sgn of [-1, 1]) {
    ctx.beginPath();
    for (let i = 0; i <= 30; i++) { const d = 0.3 + 0.55 * i / 30; ctx.lineTo(cx - halfW(d) * 0.8, cy + sgn * d * bh); }
    ctx.stroke();
  }
  ctx.lineCap = "butt";
}
function drawFrame() {
  const { cx, cy, bh, ct, mw, s } = L;
  const cw = mw + s * 1.6, post = mw + s * 0.95;
  // posts
  for (const sx of [-1, 1]) {
    const g = ctx.createLinearGradient(cx + sx * post - s * 0.25, 0, cx + sx * post + s * 0.25, 0);
    g.addColorStop(0, "#5a3b22"); g.addColorStop(0.45, "#a8794c"); g.addColorStop(1, "#4a2f1a");
    ctx.fillStyle = g;
    ctx.fillRect(cx + sx * post - s * 0.22, cy - bh, s * 0.44, bh * 2);
  }
  // caps
  for (const sy of [-1, 1]) {
    const y = sy < 0 ? cy - bh - ct : cy + bh;
    const g = ctx.createLinearGradient(0, y, 0, y + ct);
    g.addColorStop(0, "#9b6d42"); g.addColorStop(0.5, "#c08e5c"); g.addColorStop(1, "#6b4527");
    ctx.fillStyle = g;
    rrect(cx - cw, y, cw * 2, ct, ct * 0.3);
    ctx.fill();
  }
}

// ---------- state ----------
const DROP_EVERY = 7000;
const T_SLIDE = 650;
let phase = "run";      // run, done, flip, settle
let next = 0;           // index of the next element to drop
let falling = null;     // { i, t0, from, landT }
let landed = [];        // landed[i] = time it landed, or undefined
let lastDrop = -1e9, phaseT = 0, settleFrom = [];
let cardState = null;   // { type, i }
const grains = [];

function fallTime(fromY, toY) {
  const g = L.bh * 2.6; // px per s^2
  return Math.sqrt(2 * Math.max(1, toY - fromY) / g) * 1000;
}
function dropNext(now) {
  if (next >= N || falling) return;
  const p = topPos(next);
  falling = { i: next, t0: now, from: p };
  lastDrop = now;
  next++;
}

// ---------- card ----------
const card = document.getElementById("card");
const STATE = { s: "Solid", l: "Liquid", g: "Gas" };
const temp = v => v === null || v === undefined ? "Unknown" : `${v} °C`;
function renderCard() {
  if (!cardState) { card.className = card.className.replace(" show", ""); return; }
  if (cardState.type === "done") {
    card.innerHTML = `
      <div class="count">All 118 elements have fallen</div>
      <div class="txt">From hydrogen, the lightest, to oganesson, the heaviest. Every substance you have ever touched is built from the elements in that pile.</div>
      <div class="note">Flipping the hourglass to start again.</div>
      <div class="bar"><div style="width:100%"></div></div>`;
  } else {
    const d = DATA[cardState.i], c = CATS[d.cat];
    const disc = d.year === "Ancient times" ? "Ancient times" : d.year || "Unknown";
    const synthetic = /synthetic/i.test(d.source);
    const note = NOTES[d.z];
    card.innerHTML = `
      <div class="count">Element ${d.z} of ${N} &nbsp;·&nbsp; Period ${d.period}</div>
      <div class="head">
        <div class="tile" style="background:${c.color}"><span class="z">${d.z}</span><span class="s">${d.sym}</span></div>
        <div><h1>${d.name}</h1><span class="chip" style="background:${c.color}">${c.label}</span></div>
      </div>
      <div class="facts">
        <div><div class="label">Atomic mass</div><div class="val">${d.mass}</div></div>
        <div><div class="label">At room temperature</div><div class="val">${STATE[d.state] || "Unknown"}</div></div>
        <div><div class="label">Melting point</div><div class="val">${temp(d.mp)}</div></div>
        <div><div class="label">Discovered</div><div class="val">${disc}</div></div>
      </div>
      ${d.uses ? `<div class="row"><div class="label">Used for</div><div class="txt">${d.uses}</div></div>` : ""}
      ${d.source ? `<div class="row"><div class="label">${synthetic ? "Where it comes from" : "Found in"}</div><div class="txt">${synthetic ? "Made in laboratories and reactors" : d.source}</div></div>` : ""}
      ${note ? `<div class="note">${note}</div>` : ""}
      <div class="bar"><div style="width:${(d.z / N * 100).toFixed(1)}%"></div></div>`;
  }
  card.className = (landscape() ? "right" : "bottom") + " show";
}
function setCard(st) { cardState = st; renderCard(); }

// ---------- main loop ----------
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0b1020"; ctx.fillRect(0, 0, W, H);
  if (!L.top) { requestAnimationFrame(frame); return; }

  // phase logic
  if (phase === "run") {
    if (!falling && next < N && now - lastDrop >= DROP_EVERY) dropNext(now);
    if (!falling && next >= N && landed[N - 1] && now - landed[N - 1] > 2500) { phase = "done"; phaseT = now; setCard({ type: "done" }); }
  } else if (phase === "done" && now - phaseT > 6000) {
    phase = "flip"; phaseT = now;
  } else if (phase === "flip" && now - phaseT > 2600) {
    phase = "settle"; phaseT = now;
    settleFrom = DATA.map((d, i) => { const p = botPos(i); return { x: 2 * L.cx - p.x, y: 2 * L.cy - p.y }; });
    landed = []; next = 0; setCard(null);
  } else if (phase === "settle" && now - phaseT > 2200) {
    phase = "run"; lastDrop = now - DROP_EVERY + 1200;
  }

  // flip rotation
  ctx.save();
  if (phase === "flip") {
    const a = ease(Math.min(1, (now - phaseT) / 2600)) * Math.PI;
    const k = 1 - 0.28 * Math.sin(a); // shrink a little mid-turn so the corners stay on screen
    ctx.translate(L.cx, L.cy); ctx.rotate(a); ctx.scale(k, k); ctx.translate(-L.cx, -L.cy);
  }

  drawFrame();
  drawGlassBack();

  // tiles still in the top bulb
  if (phase === "settle") {
    for (let i = 0; i < N; i++) {
      const delay = (L.top[i].h / L.bh) * 700;
      const u = ease(Math.max(0, Math.min(1, (now - phaseT - delay) / 1300)));
      const a = settleFrom[i], b = topPos(i);
      drawTile(DATA[i], a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u, 1, 0, Math.PI * (1 - u));
    }
  } else {
    const startTop = falling ? falling.i + 1 : next;
    if (phase === "run") for (let i = startTop; i < N; i++) { const p = topPos(i); drawTile(DATA[i], p.x, p.y); }
    // landed tiles in the bottom bulb
    for (let i = 0; i < N; i++) {
      if (landed[i] === undefined) continue;
      const p = botPos(i), age = (now - landed[i]) / 1000;
      const glow = phase === "run" ? Math.max(0, 0.9 - age * 0.6) : 0;
      drawTile(DATA[i], p.x, p.y, 1, glow);
    }
  }

  // trickle of fine sand through the neck while running
  if (phase === "run" && next < N) {
    for (let k = 0; k < 2; k++) grains.push({ x: L.cx + (Math.random() - 0.5) * L.nw * 0.6, y: L.cy, vy: L.bh * 0.3 * Math.random() });
  }
  let pileTop = L.cy + L.bh;
  for (let i = 0; i < N; i++) if (landed[i] !== undefined && Math.abs(L.bot[i].x) < L.s) pileTop = Math.min(pileTop, botPos(i).y - L.s / 2);
  ctx.fillStyle = "rgba(255,214,150,0.55)";
  for (let k = grains.length - 1; k >= 0; k--) {
    const g = grains[k];
    g.vy += L.bh * 2.6 * dt; g.y += g.vy * dt;
    if (g.y > pileTop || phase !== "run") { grains.splice(k, 1); continue; }
    ctx.fillRect(g.x, g.y, 1.4 * DPR, 2.2 * DPR);
  }

  // the falling element
  if (falling) {
    const f = falling, d = DATA[f.i], el = now - f.t0;
    const entry = { x: L.cx, y: L.cy - L.s * 0.55 };
    const target = botPos(f.i);
    if (el < T_SLIDE) {
      const u = ease(el / T_SLIDE);
      drawTile(d, f.from.x + (entry.x - f.from.x) * u, f.from.y + (entry.y - f.from.y) * u, 1 + 0.25 * u, u);
    } else {
      if (!f.passed) { f.passed = true; setCard({ type: "el", i: f.i }); }
      const tf = fallTime(entry.y, target.y), u = Math.min(1, (el - T_SLIDE) / tf);
      const y = entry.y + (target.y - entry.y) * u * u;
      const xu = Math.max(0, (u - 0.35) / 0.65);
      const x = entry.x + (target.x - entry.x) * ease(xu);
      drawTile(d, x, y, 1.25 - 0.25 * u, 1);
      if (u >= 1) { landed[f.i] = now; falling = null; }
    }
  }

  drawGlassFront();
  ctx.restore();
  requestAnimationFrame(frame);
}

layout();
requestAnimationFrame(frame);
addEventListener("resize", layout);

// ---------- controls ----------
function skip() { if (phase === "run" && !falling) dropNext(performance.now()); }
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); skip(); }
  if (e.key === "f" || e.key === "F") toggleFs();
});
canvas.addEventListener("click", skip);
function toggleFs() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
}
document.getElementById("fs").addEventListener("click", toggleFs);
let idleTimer;
function wake() { document.body.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000); }
document.addEventListener("mousemove", wake); document.addEventListener("touchstart", wake); wake();
</script>
</body>
</html>
