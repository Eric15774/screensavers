<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar System Today</title>
<style>
:root{--bg:#05070f;--panel:rgba(14,20,40,.86);--text:#e8ecf6;--muted:#93a0bf;--accent:#ffc857;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
body.idle{cursor:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#title{position:fixed;left:3vw;top:3vh}
#title h1{font-size:clamp(20px,2.6vw,40px);font-weight:600;letter-spacing:.02em}
#title .date{color:var(--accent);font-size:clamp(14px,1.5vw,24px);margin-top:.3em}
#title .note{color:var(--muted);font-size:clamp(11px,.9vw,14px);margin-top:.5em;max-width:34ch;line-height:1.4}
#card{position:fixed;right:3vw;top:50%;transform:translateY(-50%);width:min(30vw,440px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2vw,30px);backdrop-filter:blur(6px);transition:opacity .8s}
#card.hide{opacity:0}
#card h2{font-size:clamp(26px,3vw,48px);font-weight:700;display:flex;align-items:center;gap:.4em}
#card h2 .dot{width:.6em;height:.6em;border-radius:50%;display:inline-block}
#card .tag{color:var(--muted);font-size:clamp(12px,1vw,16px);margin:.2em 0 1em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.9em 1.2em}
.grid div span{display:block;color:var(--muted);font-size:clamp(10px,.8vw,13px);text-transform:uppercase;letter-spacing:.06em}
.grid div b{font-size:clamp(14px,1.25vw,20px);font-weight:600}
.live{margin-top:1.2em;padding-top:1em;border-top:1px solid var(--line)}
.live .hd{color:var(--accent);font-size:clamp(10px,.8vw,13px);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.6em}
.fact{margin-top:1.1em;font-size:clamp(13px,1.1vw,18px);line-height:1.5}
#help{position:fixed;left:3vw;bottom:2.5vh;color:var(--muted);font-size:12px;opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">
  <h1>The Solar System Today</h1>
  <div class="date" id="date"></div>
  <div class="note">Planet positions are calculated for right now. Orbits are drawn to a compressed scale so all eight fit; the real outer planets are much farther out.</div>
</div>
<div id="card" class="hide"></div>
<div id="help">Click or Space: next planet &nbsp; F: full screen</div>
<script>
// JPL approximate Keplerian elements (Standish), valid 1800 to 2050.
// [a, e, I, L, longPeri, longNode] and rates per Julian century.
const EL={
Mercury:[[0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593],[0.00000037,0.00001906,-0.00594749,149472.67411175,0.16047689,-0.12534081]],
Venus:[[0.72333566,0.00677672,3.39467605,181.97909950,131.60246718,76.67984255],[0.00000390,-0.00004107,-0.00078890,58517.81538729,0.00268329,-0.27769418]],
Earth:[[1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0.0],[0.00000562,-0.00004392,-0.01294668,35999.37244981,0.32327364,0.0]],
Mars:[[1.52371034,0.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891],[0.00001847,0.00007882,-0.00813131,19140.30268499,0.44441088,-0.29257343]],
Jupiter:[[5.20288700,0.04838624,1.30439695,34.39644051,14.72847983,100.47390909],[-0.00011607,-0.00013253,-0.00183714,3034.74612775,0.21252668,0.20469106]],
Saturn:[[9.53667594,0.05386179,2.48599187,49.95424423,92.59887831,113.66242448],[-0.00125060,-0.00050991,0.00193609,1222.49362201,-0.41897216,-0.28867794]],
Uranus:[[19.18916464,0.04725744,0.77263783,313.23810451,170.95427630,74.01692503],[-0.00196176,-0.00004397,-0.00242939,428.48202785,0.40805281,0.04240589]],
Neptune:[[30.06992276,0.00859048,1.77004347,-55.12002969,44.96476227,131.78422574],[0.00026291,0.00005105,0.00035372,218.45945325,-0.32241464,-0.01183482]]
};
const INFO={
Mercury:{color:"#b9b2a8",size:4,type:"Rocky planet",period:"88 days",day:"176 Earth days (sunrise to sunrise)",moons:"0",diam:"4,879 km",temp:"-180 to 430 °C",
 fact:"Mercury has almost no air to hold heat, so the side facing the Sun bakes while the night side freezes. Despite being closest to the Sun, it is not the hottest planet."},
Venus:{color:"#f1d08a",size:6,type:"Rocky planet",period:"225 days",day:"117 Earth days, spinning backward",moons:"0",diam:"12,104 km",temp:"about 465 °C",
 fact:"Venus is the hottest planet because its thick carbon dioxide atmosphere traps heat. It is the clearest example of a runaway greenhouse effect we know of."},
Earth:{color:"#4fa3ff",size:6,type:"Rocky planet (home)",period:"365.25 days",day:"24 hours",moons:"1",diam:"12,742 km",temp:"average about 15 °C",
 fact:"Earth is the only planet known to have liquid water on its surface and life. Its tilt of 23.4° is what gives us seasons, not its distance from the Sun."},
Mars:{color:"#e0603a",size:5,type:"Rocky planet",period:"687 days",day:"24 h 37 min",moons:"2",diam:"6,779 km",temp:"average about -60 °C",
 fact:"Mars has the tallest volcano in the solar system, Olympus Mons, about 2.5 times the height of Mount Everest. Dry riverbeds show water once flowed there."},
Jupiter:{color:"#d9a86c",size:11,type:"Gas giant",period:"11.9 years",day:"9 h 56 min",moons:"95+",diam:"139,820 km",temp:"cloud tops about -110 °C",
 fact:"Jupiter is more than twice as massive as all the other planets combined. The Great Red Spot is a storm wider than Earth that has been raging for centuries."},
Saturn:{color:"#e8d39b",size:10,type:"Gas giant",period:"29.5 years",day:"10 h 33 min",moons:"270+",diam:"116,460 km",temp:"cloud tops about -140 °C",ring:true,
 fact:"Saturn is less dense than water. Its rings are mostly ice chunks, from dust grains to house-sized blocks, yet they are only about 10 meters thick in most places."},
Uranus:{color:"#9fe3e8",size:8,type:"Ice giant",period:"84 years",day:"17 h 14 min",moons:"28+",diam:"50,724 km",temp:"about -195 °C",
 fact:"Uranus is tipped on its side, tilted 98°. Each pole gets about 42 years of daylight followed by 42 years of darkness."},
Neptune:{color:"#4f6dff",size:8,type:"Ice giant",period:"165 years",day:"16 h 6 min",moons:"16",diam:"49,244 km",temp:"about -200 °C",
 fact:"Neptune was found with math before telescopes. In 1846 astronomers predicted where it must be from the wobble in Uranus's orbit, and it was found within a degree of the prediction."}
};
const NAMES=Object.keys(EL);
const AU_KM=149597870.7, C_KMS=299792.458;
const rad=d=>d*Math.PI/180;

function helio(name,date){
  const T=(date.getTime()/86400000+2440587.5-2451545.0)/36525;
  const [e0,r]=EL[name];
  const a=e0[0]+r[0]*T,e=e0[1]+r[1]*T,I=e0[2]+r[2]*T,L=e0[3]+r[3]*T,wb=e0[4]+r[4]*T,Om=e0[5]+r[5]*T;
  const w=wb-Om;let M=((L-wb)%360+540)%360-180;
  const ed=e*180/Math.PI;let E=M+ed*Math.sin(rad(M));
  for(let k=0;k<10;k++){const dM=M-(E-ed*Math.sin(rad(E)));const dE=dM/(1-e*Math.cos(rad(E)));E+=dE;if(Math.abs(dE)<1e-7)break}
  const xp=a*(Math.cos(rad(E))-e),yp=a*Math.sqrt(1-e*e)*Math.sin(rad(E));
  const cw=Math.cos(rad(w)),sw=Math.sin(rad(w)),cO=Math.cos(rad(Om)),sO=Math.sin(rad(Om)),cI=Math.cos(rad(I)),sI=Math.sin(rad(I));
  return{x:(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,
         y:(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,
         z:(sw*sI)*xp+(cw*sI)*yp,a,e,I,wb,Om};
}

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,stars=[];
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  stars=[];for(let i=0;i<400;i++)stars.push([Math.random()*W,Math.random()*H,Math.random()*1.2+.2,Math.random()*6.28]);}
addEventListener('resize',resize);resize();

// compressed (logarithmic) radius so the inner planets have room
const scaleR=a=>Math.log(1+a/0.25)/Math.log(1+30.1/0.25);
function center(){const cardL=W-W*0.03-Math.min(W*0.30,440);const cx=Math.min(W*0.40,cardL*0.5);return{cx,cy:H*0.55,R:Math.min(H*0.42,cx-70,cardL-cx-90)}}
function toScreen(p){const{cx,cy,R}=center();const d=Math.hypot(p.x,p.y);const s=scaleR(d)*R/d;return[cx+p.x*s,cy-p.y*s]}

let focus=-1,focusStart=0,zoom=1,zoomT=1;
const HOLD=18000;
function fmt(n,d=0){return n.toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d})}
function lightTime(km){const s=km/C_KMS;if(s<3600)return fmt(s/60,1)+" minutes";return Math.floor(s/3600)+" h "+Math.round((s%3600)/60)+" min"}

function showCard(){
  const name=NAMES[focus],inf=INFO[name],now=new Date();
  const p=helio(name,now),ea=helio('Earth',now);
  const rSun=Math.hypot(p.x,p.y,p.z)*AU_KM;
  let live=`<div class="grid"><div><span>From the Sun now</span><b>${fmt(rSun/1e6,1)} million km</b></div><div><span>Sunlight takes</span><b>${lightTime(rSun)}</b></div>`;
  if(name!=='Earth'){const dE=Math.hypot(p.x-ea.x,p.y-ea.y,p.z-ea.z)*AU_KM;
    live+=`<div><span>From Earth now</span><b>${fmt(dE/1e6,1)} million km</b></div><div><span>Radio signal takes</span><b>${lightTime(dE)}</b></div>`}
  else live+=`<div><span>Distance in AU</span><b>${fmt(rSun/AU_KM,3)} AU</b></div><div><span>Orbital speed</span><b>about 30 km/s</b></div>`;
  live+='</div>';
  const card=document.getElementById('card');
  card.innerHTML=`<h2><i class="dot" style="background:${inf.color}"></i>${name}</h2><div class="tag">${inf.type}</div>
  <div class="grid"><div><span>Year (orbit)</span><b>${inf.period}</b></div><div><span>Day</span><b>${inf.day}</b></div>
  <div><span>Diameter</span><b>${inf.diam}</b></div><div><span>Known moons</span><b>${inf.moons}</b></div>
  <div style="grid-column:1/3"><span>Temperature</span><b>${inf.temp}</b></div></div>
  <div class="live"><div class="hd">Right now</div>${live}</div>
  <div class="fact">${inf.fact}</div>`;
  card.classList.remove('hide');
}
function next(){const card=document.getElementById('card');card.classList.add('hide');
  setTimeout(()=>{focus=(focus+1)%NAMES.length;focusStart=performance.now();showCard()},focus<0?0:700)}

let orbitCache=null,orbitKey='';
function draw(t){
  const now=new Date();
  ctx.fillStyle='#05070f';ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=.35+.35*Math.sin(t/1500+s[3]);ctx.fillStyle='#fff';ctx.fillRect(s[0],s[1],s[2],s[2])}
  ctx.globalAlpha=1;
  const{cx,cy,R}=center();
  // orbits (cache per size, per day)
  const key=W+'x'+H+now.toDateString();
  if(key!==orbitKey){orbitKey=key;orbitCache=document.createElement('canvas');orbitCache.width=W*DPR;orbitCache.height=H*DPR;
    const o=orbitCache.getContext('2d');o.setTransform(DPR,0,0,DPR,0,0);const save=ctx;
    o.lineWidth=1;o.strokeStyle='rgba(150,170,220,.22)';
    for(const n of NAMES){const p=helio(n,now);o.beginPath();
      for(let k=0;k<=240;k++){const days=k/240*365.25*Math.pow(p.a,1.5);const q=helio(n,new Date(now.getTime()+days*86400000));const[x,y]=toScreen(q);k?o.lineTo(x,y):o.moveTo(x,y)}o.stroke()}
    // asteroid belt hint
    for(let i=0;i<700;i++){const a=2.2+Math.random()*1.1,th=Math.random()*6.283;const d=scaleR(a)*R;o.fillStyle='rgba(180,170,150,.25)';o.fillRect(cx+Math.cos(th)*d,cy-Math.sin(th)*d,1,1)}
  }
  ctx.drawImage(orbitCache,0,0,W,H);
  // vernal equinox direction label
  ctx.fillStyle='rgba(150,170,220,.45)';ctx.font='11px system-ui';ctx.fillText('→ direction of the March equinox',cx+R*1.02-200,cy+16);
  // Sun
  const sr=Math.max(14,R*0.07);const g=ctx.createRadialGradient(cx,cy,0,cx,cy,sr);g.addColorStop(0,'#fff6c8');g.addColorStop(.25,'#ffcc4d');g.addColorStop(1,'rgba(255,150,40,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,sr,0,7);ctx.fill();
  // planets
  for(let i=0;i<NAMES.length;i++){const n=NAMES[i],inf=INFO[n];const[x,y]=toScreen(helio(n,now));
    const f=i===focus;const pulse=f?1+.25*Math.sin(t/300):1;
    if(f){ctx.strokeStyle=inf.color;ctx.globalAlpha=.6;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,inf.size*2.6*pulse+6,0,7);ctx.stroke();ctx.globalAlpha=1}
    if(inf.ring){ctx.strokeStyle='rgba(232,211,155,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,inf.size*1.9,inf.size*.7,-.4,0,7);ctx.stroke()}
    ctx.fillStyle=inf.color;ctx.beginPath();ctx.arc(x,y,inf.size,0,7);ctx.fill();
    ctx.fillStyle=f?'#fff':'rgba(220,228,245,.75)';ctx.font=(f?'600 15px':'12px')+' system-ui';ctx.fillText(n,x+inf.size+6,y-inf.size-2)}
  // line from Earth to focused planet
  if(focus>=0&&NAMES[focus]!=='Earth'){const[ex,ey]=toScreen(helio('Earth',now)),[px,py]=toScreen(helio(NAMES[focus],now));
    ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(255,200,87,.55)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(px,py);ctx.stroke();ctx.setLineDash([]);
    // a "photon" running along it
    const u=((t-focusStart)/2500)%1;ctx.fillStyle='#ffc857';ctx.beginPath();ctx.arc(px+(ex-px)*u,py+(ey-py)*u,2.5,0,7);ctx.fill()}
  document.getElementById('date').textContent=now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'  ·  '+now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  if(focus>=0&&performance.now()-focusStart>HOLD)next();
  requestAnimationFrame(draw);
}
next();requestAnimationFrame(draw);
// live numbers refresh
setInterval(()=>{if(focus>=0)showCard()},60000);
// controls
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();next()}if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}});
addEventListener('click',next);
let idleT;addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),3000)});
setTimeout(()=>location.reload(),6*3600*1000);
</script>
</body>
</html>
