<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>When This Light Left</title>
<style>
:root{--bg:#02030a;--panel:rgba(12,14,32,.86);--text:#eef0fa;--muted:#9aa0c4;--accent:#ffd27a;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
body.idle{cursor:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#title{position:fixed;left:3vw;top:3vh;max-width:40vw}
#title h1{font-size:clamp(20px,2.5vw,40px);font-weight:600}
#title p{color:var(--muted);font-size:clamp(12px,1vw,16px);margin-top:.4em;line-height:1.45}
#card{position:fixed;right:3vw;top:44%;transform:translateY(-50%);width:min(34vw,480px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,2vw,30px);transition:opacity .8s;backdrop-filter:blur(4px)}
#card.hide{opacity:0}
#card h2{font-size:clamp(30px,3.4vw,56px);font-weight:700;line-height:1}
#card .con{color:var(--muted);font-size:clamp(12px,1vw,16px);margin:.4em 0 1em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.8em 1.2em}
.grid span{display:block;color:var(--muted);font-size:clamp(10px,.75vw,12px);text-transform:uppercase;letter-spacing:.06em}
.grid b{font-size:clamp(14px,1.25vw,20px);font-weight:600}
.left{margin-top:1.2em;padding-top:1em;border-top:1px solid var(--line)}
.left .hd{color:var(--muted);font-size:clamp(10px,.8vw,13px);text-transform:uppercase;letter-spacing:.08em}
.left .yr{font-size:clamp(30px,3.4vw,54px);font-weight:800;color:var(--accent);line-height:1.1}
.left .ev{font-size:clamp(14px,1.15vw,19px);line-height:1.5;margin-top:.3em}
.fact{margin-top:1em;color:var(--muted);font-size:clamp(12px,1vw,16px);line-height:1.5}
#timeline{position:fixed;left:4vw;right:4vw;bottom:7vh;height:70px}
#help{position:fixed;right:3vw;bottom:2vh;color:var(--muted);font-size:12px;opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><h1>When This Light Left</h1><p>Light is the fastest thing there is, but space is so big that starlight still takes years, centuries or longer to reach us. When you look at a star, you are seeing it as it was when that light set out.</p></div>
<div id="card" class="hide"></div>
<div id="help">Click or Space: next &nbsp; F: full screen</div>
<script>
// d = distance in light-years (seconds for Sun and Moon handled separately)
// Distances are typical published values; far stars carry real uncertainty, noted in "unc".
const STARS=[
{n:"The Moon",sec:1.28,con:"Earth's natural satellite",type:"Reflected sunlight",col:"#dfe3ea",size:.8,
 ev:"Moonlight is just over a second old. Radio messages from the Apollo astronauts took about 1.3 seconds to reach Earth.",
 fact:"Astronauts left mirrors on the Moon. Scientists still bounce lasers off them and time the round trip to measure the distance to within a few millimeters."},
{n:"The Sun",sec:499,con:"Our star",type:"Yellow dwarf (G2)",col:"#fff1b8",size:1.4,
 ev:"The sunlight coming in your window left the Sun about 8 minutes and 20 seconds ago. If the Sun vanished, we would not know for 8 minutes.",
 fact:"The energy in that light was made in the Sun's core thousands of years earlier and slowly worked its way out to the surface."},
{n:"Proxima Centauri",d:4.24,con:"Centaurus (Southern sky)",type:"Red dwarf",col:"#ff8a65",size:.7,
 ev:"It is the nearest star to the Sun, and it has at least one planet in its habitable zone.",
 fact:"Our fastest spacecraft would still need thousands of years to get there."},
{n:"Sirius",d:8.6,con:"Canis Major, the Great Dog",type:"White main-sequence star (A1)",col:"#cfe3ff",size:1.3,
 ev:"SpaceX first launched its Falcon Heavy rocket in February 2018, sending a car past the orbit of Mars.",
 fact:"Sirius is the brightest star in the night sky. It looks bright because it is both close and about 25 times as luminous as the Sun."},
{n:"Procyon",d:11.46,con:"Canis Minor, the Little Dog",type:"Yellow-white star (F5)",col:"#fff4dc",size:1.1,
 ev:"In July 2015 the New Horizons spacecraft flew past Pluto and sent back the first close-up pictures of it.",
 fact:"Like Sirius, Procyon has a faint white dwarf companion, the leftover core of a dead star."},
{n:"Altair",d:16.7,con:"Aquila, the Eagle",type:"White star (A7)",col:"#e8f0ff",size:1.1,
 ev:"This light left around the time most of today's high school seniors were born.",
 fact:"Altair spins so fast, once every 9 hours, that it bulges at its equator and is about 20 percent wider there than pole to pole."},
{n:"Vega",d:25.0,con:"Lyra, the Lyre",type:"White star (A0)",col:"#d6e6ff",size:1.2,
 ev:"Wikipedia went online in January 2001, and the first iPod went on sale that October.",
 fact:"Vega was the North Star about 12,000 years ago and will be again in about 13,000 years, because Earth's axis slowly wobbles."},
{n:"Pollux",d:33.8,con:"Gemini, the Twins",type:"Orange giant (K0)",col:"#ffc98a",size:1.1,
 ev:"In 1992 astronomers confirmed the first planets ever found outside our solar system. Pollux itself has a giant planet, found in 2006.",
 fact:"Pollux is the closest giant star to the Sun."},
{n:"Arcturus",d:36.7,con:"Boötes, the Herdsman",type:"Orange giant (K1.5)",col:"#ffbe7a",size:1.25,
 ev:"The Berlin Wall fell in November 1989, and the Hubble Space Telescope launched in April 1990.",
 fact:"Arcturus is a giant about 25 times wider than the Sun. Its light was used to switch on the lights of the 1933 Chicago World's Fair, because astronomers then believed that light had left the star during the 1893 Chicago fair."},
{n:"Capella",d:42.9,con:"Auriga, the Charioteer",type:"Pair of yellow giants",col:"#fff0b0",size:1.2,
 ev:"In June 1983 Sally Ride became the first American woman in space.",
 fact:"Capella looks like one star, but it is two giant stars orbiting each other every 104 days."},
{n:"Castor",d:51,con:"Gemini, the Twins",type:"Six stars in three pairs",col:"#e6efff",size:1.05,
 ev:"In July 1975 American and Soviet spacecraft docked in orbit during the Apollo-Soyuz mission, and the crews shook hands.",
 fact:"Through a telescope Castor splits into two stars, and each of those is itself a pair, plus a third faint pair nearby. Six stars in all."},
{n:"Aldebaran",d:65.3,con:"Taurus, the Bull",type:"Orange giant (K5)",col:"#ff9f5a",size:1.25,
 ev:"In April 1961 Yuri Gagarin became the first human to orbit Earth.",
 fact:"Aldebaran is the bull's red eye in Taurus. Pioneer 10, which left our solar system, is headed in its general direction and would take about 2 million years to get there."},
{n:"Regulus",d:79.3,con:"Leo, the Lion",type:"Blue-white star (B8)",col:"#cddcff",size:1.15,
 ev:"In December 1947, scientists at Bell Labs built the first transistor. Every phone and computer is built on that invention.",
 fact:"Regulus spins so fast it is nearly flattened. A little faster and it would start flinging itself apart."},
{n:"Spica",d:250,con:"Virgo, the Maiden",type:"Pair of blue giants",col:"#bcd0ff",size:1.25,unc:"±10",
 ev:"The Declaration of Independence was signed in Philadelphia in 1776.",
 fact:"Spica is two hot stars so close together that they pull each other into egg shapes. They orbit each other every 4 days."},
{n:"Polaris",d:433,con:"Ursa Minor, the Little Dipper",type:"Yellow supergiant (F7)",col:"#fff2c8",size:1.2,unc:"estimates range from about 320 to 450",
 ev:"In the late 1500s, Galileo was a young professor studying how objects fall.",
 fact:"Polaris sits almost exactly above Earth's North Pole, so it barely moves as the sky turns. Its altitude above your horizon equals your latitude, about 41° here in western Pennsylvania."},
{n:"The Pleiades",d:444,con:"Taurus (the Seven Sisters)",type:"Star cluster of about 1,000 young stars",col:"#bcd4ff",size:1.1,unc:"±10",
 ev:"In 1582 much of Europe switched to the Gregorian calendar, the one we still use. October 4 was followed directly by October 15.",
 fact:"These stars formed together only about 100 million years ago, after the dinosaurs were already on Earth."},
{n:"Betelgeuse",d:550,con:"Orion, the Hunter",type:"Red supergiant (M1)",col:"#ff7a4a",size:1.45,unc:"estimates range from about 500 to 700",
 ev:"In the 1470s Leonardo da Vinci was a young painter in Florence, and Columbus had not yet sailed.",
 fact:"Betelgeuse is so large that, placed where the Sun is, it would reach past the orbit of Mars. It will explode as a supernova someday, but that could be 100,000 years away."},
{n:"Rigel",d:860,con:"Orion, the Hunter",type:"Blue supergiant (B8)",col:"#b4c8ff",size:1.35,unc:"estimates vary by about 10 percent",
 ev:"This light set out in the 1100s, during the Middle Ages, when great stone cathedrals were going up across Europe.",
 fact:"Rigel shines about 100,000 times brighter than the Sun."},
{n:"Deneb",d:2600,con:"Cygnus, the Swan",type:"White supergiant (A2)",col:"#e8eeff",size:1.3,unc:"estimates range from about 1,500 to 2,600",
 ev:"Around 600 BC, the time of the Babylonian exile. Jerusalem fell to Babylon in 586 BC.",
 fact:"Deneb is one of the most luminous stars we can see without a telescope. If it were as close as Vega, it would cast shadows at night."},
{n:"Andromeda Galaxy",d:2500000,con:"Andromeda",type:"Spiral galaxy of about a trillion stars",col:"#e9dcff",size:1.6,galaxy:true,
 ev:"When this light left, our ancestors in Africa were just starting to make simple stone tools. No humans like us existed yet.",
 fact:"Andromeda is the most distant thing most people can see with the naked eye. It is moving toward us and will merge with our Milky Way in about 4 to 5 billion years."}
];

const YEAR=new Date().getFullYear()+(new Date().getMonth()+.5)/12;
function leftYear(d){const y=YEAR-d;if(y>=0)return Math.floor(y).toString();return Math.round(-y).toLocaleString('en-US')+" BC"}
function fmtLY(d){if(d>=1e6)return(d/1e6).toLocaleString('en-US',{maximumFractionDigits:1})+" million";return d.toLocaleString('en-US',{maximumFractionDigits:d<20?2:1})}
const KM_PER_LY=9.4607e12;

const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,DPR,bg=[];
function resize(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  bg=[];for(let i=0;i<700;i++)bg.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,p:Math.random()*6.28,z:Math.random()*.9+.1})}
addEventListener('resize',resize);resize();

let idx=-1,start=0;const HOLD=17000;
function next(){const card=document.getElementById('card');card.classList.add('hide');
  setTimeout(()=>{idx=(idx+1)%STARS.length;start=performance.now();show()},idx<0?0:800)}
function show(){
  const s=STARS[idx];let html=`<h2>${s.n}</h2><div class="con">${s.con}</div><div class="grid">`;
  if(s.sec){const t=s.sec<60?s.sec.toFixed(2)+" seconds":Math.floor(s.sec/60)+" min "+Math.round(s.sec%60)+" s";
    const km=s.sec*299792.458;
    html+=`<div><span>Light travel time</span><b>${t}</b></div><div><span>Distance</span><b>${km<1e6?Math.round(km).toLocaleString('en-US')+" km":(km/1e6).toFixed(1)+" million km"}</b></div><div style="grid-column:1/3"><span>Type</span><b>${s.type}</b></div></div>`;
    html+=`<div class="left"><div class="hd">This light left</div><div class="yr">${s.sec<60?"A second ago":"8 minutes ago"}</div><div class="ev">${s.ev}</div></div>`;
  }else{
    html+=`<div><span>Distance</span><b>${fmtLY(s.d)} light-years</b></div><div><span>In kilometers</span><b>${(s.d*KM_PER_LY).toExponential(1).replace(/e\+(\d+)/,(m,k)=>' × 10'+[...k].map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]).join(''))} km</b></div><div style="grid-column:1/3"><span>Type</span><b>${s.type}</b></div></div>`;
    const yr=s.d>=1e5?"About "+fmtLY(s.d)+" years ago":"Around "+leftYear(s.d);
    const lead=`<div class="ev">${s.ev}</div>`;
    html+=`<div class="left"><div class="hd">This light left</div><div class="yr" style="${yr.length>14?'font-size:clamp(22px,2.2vw,36px)':''}">${yr}</div>${lead}${s.unc?`<div class="fact" style="margin-top:.4em">Distance uncertainty: ${s.unc}${/^±/.test(s.unc)?' light-years':''}.</div>`:''}</div>`;
  }
  html+=`<div class="fact">${s.fact}</div>`;
  const card=document.getElementById('card');card.innerHTML=html;card.classList.remove('hide');
}

function drawStar(x,y,R,col,t,galaxy,moon){
  if(moon){const g=ctx.createRadialGradient(x-R*.4,y-R*.4,R*.2,x,y,R*1.6);g.addColorStop(0,'#f4f5f8');g.addColorStop(1,'#8a8f9c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R*1.6,0,7);ctx.fill();
    ctx.fillStyle='rgba(90,95,110,.35)';for(const[a,b,r]of[[-.5,-.3,.35],[.4,.2,.25],[-.1,.6,.2],[.6,-.6,.15]]){ctx.beginPath();ctx.arc(x+a*R,y+b*R,r*R,0,7);ctx.fill()}return}
  if(galaxy){ctx.save();ctx.translate(x,y);ctx.rotate(-.5);
    for(let i=0;i<4;i++){const g=ctx.createRadialGradient(0,0,0,0,0,R*(2.4-i*.4));g.addColorStop(0,'rgba(255,245,230,'+(.35+i*.15)+')');g.addColorStop(1,'rgba(160,140,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,R*(2.6-i*.4),R*(.8-i*.12),0,0,7);ctx.fill()}
    ctx.restore();return}
  const tw=1+.04*Math.sin(t/400);
  const g=ctx.createRadialGradient(x,y,0,x,y,R*3*tw);g.addColorStop(0,'#ffffff');g.addColorStop(.12,col);g.addColorStop(.35,col+'55');g.addColorStop(1,col+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R*3*tw,0,7);ctx.fill();
  ctx.strokeStyle=col+'aa';ctx.lineWidth=1.2;
  for(const a of[0,Math.PI/2]){ctx.beginPath();ctx.moveTo(x-Math.cos(a)*R*4.2*tw,y-Math.sin(a)*R*4.2*tw);ctx.lineTo(x+Math.cos(a)*R*4.2*tw,y+Math.sin(a)*R*4.2*tw);ctx.stroke()}
}
function frame(t){
  ctx.fillStyle='#02030a';ctx.fillRect(0,0,W,H);
  for(const b of bg){b.x-=b.z*.05;if(b.x<0)b.x+=W;ctx.globalAlpha=(.3+.4*Math.sin(t/1200+b.p))*b.z+.1;ctx.fillStyle='#fff';ctx.fillRect(b.x,b.y,b.r,b.r)}
  ctx.globalAlpha=1;
  if(idx>=0){const s=STARS[idx];const el=(performance.now()-start)/1000;const fade=Math.min(1,el/1.5);
    const sx=W*0.28,sy=H*0.44,R=Math.min(W,H)*0.045*s.size;
    ctx.globalAlpha=fade;drawStar(sx,sy,R,s.col,t,s.galaxy,s.n==='The Moon');ctx.globalAlpha=1;
    // timeline: star (left) to Earth (right)
    const x0=W*0.06,x1=W*0.94,y=H*0.86;
    ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
    ctx.fillStyle=s.col;ctx.beginPath();ctx.arc(x0,y,6,0,7);ctx.fill();
    ctx.fillStyle='#4fa3ff';ctx.beginPath();ctx.arc(x1,y,6,0,7);ctx.fill();
    ctx.font='600 13px system-ui';ctx.textBaseline='bottom';ctx.fillStyle='#eef0fa';ctx.textAlign='left';ctx.fillText(s.n,x0-4,y-12);ctx.textAlign='right';ctx.fillText('Earth, today',x1+4,y-12);
    ctx.textBaseline='top';ctx.font='12px system-ui';ctx.fillStyle='#9aa0c4';ctx.textAlign='left';
    const startLbl=s.sec?(s.sec<60?'1.3 seconds ago':'8 min 20 s ago'):(s.d>=1e5?fmtLY(s.d)+' years ago':'Light leaves, around '+leftYear(s.d));
    ctx.fillText(startLbl,x0-4,y+12);ctx.textAlign='right';ctx.fillText(s.sec?'Light arrives, now':'Light arrives, '+Math.floor(YEAR),x1+4,y+12);
    // photons racing along the timeline
    for(let i=0;i<5;i++){const u=((el/6)+i/5)%1;const px=x0+(x1-x0)*u;
      const g=ctx.createLinearGradient(px-60,0,px,0);g.addColorStop(0,'rgba(255,210,122,0)');g.addColorStop(1,'rgba(255,210,122,.9)');
      ctx.strokeStyle=g;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(Math.max(x0,px-60),y);ctx.lineTo(px,y);ctx.stroke()}
    // decade/century tick marks for stars under 1,000 ly
    if(s.d&&s.d<1000){const step=s.d<20?1:s.d<60?5:s.d<120?10:s.d<300?25:100;const y0=YEAR-s.d;
      ctx.fillStyle='rgba(154,160,196,.7)';ctx.textAlign='center';ctx.font='10px system-ui';
      for(let yy=Math.ceil(y0/step)*step;yy<YEAR;yy+=step){const u=(yy-y0)/s.d;if(u<.11||u>.9)continue;const px=x0+(x1-x0)*u;ctx.fillRect(px,y-4,1,8);ctx.fillText(yy,px,y+8)}}
  }
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  if(idx>=0&&performance.now()-start>HOLD)next();
  requestAnimationFrame(frame);
}
next();requestAnimationFrame(frame);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();next()}if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}});
addEventListener('click',next);
let idleT;addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),3000)});
</script>
</body>
</html>
